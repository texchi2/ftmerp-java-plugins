# Garment SKU generator (assignGarmentSkus). Ships SWITCHED OFF; the owner of the garment code turns it on.
# To turn it on WITHOUT a deploy or restart: a SystemProperty row overrides this file -
#   systemResourceId = ftm-garments, systemPropertyId = garmentSku.enabled, systemPropertyValue = Y
# (WebTools > Entity Data Maintenance > SystemProperty). Remove the row or set N to switch it off again.
garmentSku.enabled=N
# The FtmSkuRule that composes a garment code; empty until the owner writes the rule.
garmentSku.ruleId=
